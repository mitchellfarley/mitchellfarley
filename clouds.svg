<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="drifting clouds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#EAF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <symbol id="cloud" viewBox="0 0 200 70">
      <g fill="#FFFFFF">
        <circle cx="40"  cy="42" r="22"/>
        <circle cx="70"  cy="30" r="28"/>
        <circle cx="105" cy="26" r="32"/>
        <circle cx="140" cy="32" r="26"/>
        <circle cx="168" cy="44" r="20"/>
        <rect   x="38"  y="42"  width="135" height="20" rx="10"/>
      </g>
    </symbol>

    <symbol id="cloudSmall" viewBox="0 0 140 50">
      <g fill="#FFFFFF">
        <circle cx="28"  cy="30" r="16"/>
        <circle cx="50"  cy="22" r="20"/>
        <circle cx="78"  cy="20" r="22"/>
        <circle cx="104" cy="26" r="18"/>
        <circle cx="124" cy="32" r="14"/>
        <rect   x="26"  y="30"  width="100" height="14" rx="7"/>
      </g>
    </symbol>
  </defs>

  <rect width="900" height="220" fill="url(#sky)"/>

  <g opacity="0.55">
    <use href="#cloudSmall" x="-160" y="30" width="140" height="50">
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="1200 0" dur="60s" repeatCount="indefinite"/>
    </use>
    <use href="#cloudSmall" x="-160" y="70" width="120" height="42">
      <animateTransform attributeName="transform" type="translate"
        from="-300 0" to="1100 0" dur="75s" repeatCount="indefinite"/>
    </use>
  </g>

  <g opacity="0.85">
    <use href="#cloud" x="-220" y="20" width="220" height="80">
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="1200 0" dur="38s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="-220" y="110" width="260" height="92">
      <animateTransform attributeName="transform" type="translate"
        from="-500 0" to="1200 0" dur="46s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="-220" y="60" width="200" height="72">
      <animateTransform attributeName="transform" type="translate"
        from="-900 0" to="1200 0" dur="52s" repeatCount="indefinite"/>
    </use>
  </g>

  <g opacity="1">
    <use href="#cloud" x="-280" y="140" width="300" height="100">
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="1300 0" dur="28s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="-280" y="30"  width="240" height="84">
      <animateTransform attributeName="transform" type="translate"
        from="-700 0" to="1300 0" dur="32s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
